# cargo-deny — supply-chain gates for the Rust dependency tree.
# CI runs: cargo deny --manifest-path src-tauri/Cargo.toml check advisories bans sources
# (licenses are configured below but not enforced in CI; run `check licenses` to use them.)

[advisories]
version = 2
# Fail on any RustSec *vulnerability* in the tree, and on installed-but-yanked crates.
yanked = "deny"
# Only flag "unmaintained" advisories for crates we depend on directly. Deep transitive
# ones (e.g. unic-* via tauri → urlpattern, RUSTSEC-2025-0098) are unfixable from here
# and would just keep CI permanently red.
unmaintained = "workspace"

[bans]
# Warn (don't fail) on duplicate versions and wildcard requirements — informational
# for a personal project, not a hard gate.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# The core anti-typosquat / anti-confusion control: only the official registry is
# allowed; any other registry or a git dependency fails the build.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CC0-1.0",
]
