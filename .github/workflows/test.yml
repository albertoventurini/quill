name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUILL_TEST_PG_URL: postgres://postgres:dev@localhost:5432/postgres

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: src-tauri

      - name: Run frontend type-check
        run: pnpm check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust: RustSec advisories + crates.io-only source allowlist + ban checks.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans sources

      # JS: fail only on high/critical advisories; install is frozen to the lockfile.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

      # Cross-ecosystem: OSV DB merges RustSec + GHSA + others, so it catches
      # advisories that per-ecosystem tools haven't picked up yet. Reads both
      # Cargo.lock and pnpm-lock.yaml in one pass.
      - name: Install osv-scanner
        # Pinned: Dependabot doesn't manage raw binary URLs, so bump this
        # manually after reviewing the release notes.
        env:
          OSV_VERSION: "2.3.8"
        run: |
          curl -sSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
      - name: osv-scanner
        # --config applies osv-scanner.toml globally; a bare root config would
        # only cover lockfiles in the repo root, not src-tauri/Cargo.lock.
        run: osv-scanner scan source --recursive --config ./osv-scanner.toml .
